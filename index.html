<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Řídkošil – Profesionální malířství a montáže</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#475569', /* slate-600 */
                        accentHover: '#334155', /* slate-700 */
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-[#fdfdfc] text-slate-800 flex flex-col min-h-screen">
    
    <!-- Hero Sekce -->
    <header class="py-20 md:py-32 border-b border-slate-200 bg-white">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h1 class="text-3xl md:text-5xl font-semibold mb-6 text-slate-900 leading-tight">
                Roman Řídkošil – Profesionální malířství a montáže
            </h1>
            <p class="text-xl md:text-2xl text-slate-600">
                Působím v Budiměřicích a okolí
            </p>
        </div>
    </header>

    <main class="flex-grow">
        
        <!-- Sekce Služby -->
        <section class="py-16 md:py-24">
            <div class="max-w-4xl mx-auto px-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                    <div class="bg-white p-8 border border-slate-200 text-center flex items-center justify-center min-h-[120px]">
                        <h2 class="text-lg md:text-xl font-semibold text-slate-800">Malířské a lakýrnické práce</h2>
                    </div>
                    <div class="bg-white p-8 border border-slate-200 text-center flex items-center justify-center min-h-[120px]">
                        <h2 class="text-lg md:text-xl font-semibold text-slate-800">Montáž sádrokartonu</h2>
                    </div>
                    <div class="bg-white p-8 border border-slate-200 text-center flex items-center justify-center min-h-[120px]">
                        <h2 class="text-lg md:text-xl font-semibold text-slate-800">Plovoucí podlahy</h2>
                    </div>
                    <div class="bg-white p-8 border border-slate-200 text-center flex items-center justify-center min-h-[120px]">
                        <h2 class="text-lg md:text-xl font-semibold text-slate-800">Drobné zednické práce</h2>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sekce Galerie -->
        <section class="py-16 md:py-24 border-t border-slate-200 bg-white">
            <div class="max-w-5xl mx-auto px-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                    <img src="https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&w=800&q=80" alt="Malíř při práci" class="w-full aspect-[4/3] object-cover border border-slate-200">
                    <img src="https://images.unsplash.com/photo-1562259949-e8e7689d7828?auto=format&fit=crop&w=800&q=80" alt="Detail malování" class="w-full aspect-[4/3] object-cover border border-slate-200">
                    <img src="https://images.unsplash.com/photo-1502672260266-1c1c6741b8a2?auto=format&fit=crop&w=800&q=80" alt="Malířské potřeby" class="w-full aspect-[4/3] object-cover border border-slate-200">
                    <img src="https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&w=800&q=80" alt="Renovace interiéru" class="w-full aspect-[4/3] object-cover border border-slate-200">
                </div>
            </div>
        </section>

        <!-- Sekce Ceník -->
        <section class="py-16 md:py-24 border-t border-slate-200">
            <div class="max-w-4xl mx-auto px-6 text-center">
                <div class="bg-slate-100 p-8 md:p-12 border border-slate-200 inline-block">
                    <p class="text-xl text-slate-800 font-medium">Pro konzultaci ceny volejte nebo pište na e-mail.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Patička -->
    <footer class="bg-white border-t border-slate-200 py-12 md:py-16">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <div class="flex flex-col md:flex-row justify-center items-center gap-6 md:gap-12 text-lg text-slate-700">
                <a href="mailto:roman.ridkosil@post.cz" class="hover:text-slate-900 transition-colors">roman.ridkosil@post.cz</a>
                <a href="tel:+420XXXXXXXXX" class="hover:text-slate-900 transition-colors">+420 XXX XXX XXX</a>
            </div>
        </div>
    </footer>

</body>
</html>
